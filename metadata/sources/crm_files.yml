# Quelle: Dateien im Source Storage (simuliertes CRM-Export), gelesen über das External Volume.
source:
  name: crm_files
  type: files
  ingestion_mode: autoloader
  location: products/                # relativ zu /Volumes/<env>_bronze/landing/files/
  format: csv
  options:
    header: "true"
    delimiter: ";"
  bronze_schema: crm_files
  silver_schema: crm_files
  trigger: file_arrival              # Job startet, sobald neue Dateien ankommen
  tags:
    domain: sales

tables:
  - name: products
    pattern: "products_*.csv"
    keys: [product_code]
    silver:
      scd_type: 2
      sequence_by: _file_modification_time
      track_history_columns: [product_name, category, price]
      transforms:
        - { column: product_code, fn: clean_string }
        - { column: product_name, fn: clean_string }
        - { column: category, fn: clean_string }
        - { column: valid_from, fn: parse_date_multi }
      expectations:
        code_present: { expr: "product_code IS NOT NULL", action: drop }
        price_present: { expr: "price IS NOT NULL", action: warn }
