env: dev
catalogs:
  bronze: dev_bronze
  silver: dev_silver
  gold: dev_gold
  platform: dev_platform
schedules:
  hourly:
    cron: "0 0 * * * ?"
    timezone: Europe/Berlin
    pause_status: PAUSED            # PoC: überall pausiert (Kosten); Läufe manuell/über Trigger
jobs:
  performance_target: STANDARD         # STANDARD = günstiger Serverless-Modus (4-6 min Start)
