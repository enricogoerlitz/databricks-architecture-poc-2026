[project]
name = "dbxpoc-common"
version = "0.2.0"
description = "Wiederverwendbare Funktionen und Klassen (Silver) für den Databricks-PoC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # pyspark wird zur Laufzeit von Databricks bereitgestellt

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbxpoc_common"]
