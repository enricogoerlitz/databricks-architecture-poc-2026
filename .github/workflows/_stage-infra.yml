# Wiederverwendbar: Terraform-Stacks einer Stage anwenden (azure -> sources -> databricks).
name: _stage-infra

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}   # Gate (tst/prd: Approval) + OIDC-Subject environment:<env>
    concurrency:
      group: infra-${{ inputs.env }}
      cancel-in-progress: false
    env:
      ENV: ${{ inputs.env }}
      PREFIX: ${{ vars.PREFIX }}
      SUFFIX: ${{ vars.SUFFIX }}
      TF_IN_AUTOMATION: "1"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      # Werte, die lokal das Makefile exportiert (terraform wird hier direkt aufgerufen)
      TF_VAR_env: ${{ inputs.env }}
      TF_VAR_prefix: ${{ vars.PREFIX }}
      TF_VAR_suffix: ${{ vars.SUFFIX }}
      TF_VAR_tfstate_resource_group: ${{ vars.TF_STATE_RG }}
      TF_VAR_tfstate_storage_account: ${{ vars.TF_STATE_SA }}
      # CI-SPs haben keine Graph-Rechte: IDs kommen vorab aufgelöst als Secrets (Bootstrap)
      TF_VAR_deploy_sp_client_id: ${{ secrets.AZURE_CLIENT_ID_DEPLOY }}
      TF_VAR_infra_sp_client_id: ${{ secrets.AZURE_CLIENT_ID_INFRA }}
      TF_VAR_azure_databricks_sp_object_id: ${{ secrets.AZURE_DATABRICKS_SP_OBJECT_ID }}
      TF_VAR_kv_admin_object_ids: ${{ secrets.KV_ADMIN_OBJECT_IDS }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"
          terraform_wrapper: false
      # Frisches OIDC-Login je Stack: Die GitHub-Client-Assertion ist nur 5 min gültig. Danach kann
      # die Azure CLI keine neuen Tokens (z. B. für Databricks) mehr holen (AADSTS700024).
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_INFRA }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: terraform azure
        run: infra/scripts/ci-terraform-stack.sh azure
      # Frisches OIDC-Login je Stack: Die GitHub-Client-Assertion ist nur 5 min gültig. Danach kann
      # die Azure CLI keine neuen Tokens (z. B. für Databricks) mehr holen (AADSTS700024).
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_INFRA }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: terraform sources
        run: infra/scripts/ci-terraform-stack.sh sources
      # Frisches OIDC-Login je Stack: Die GitHub-Client-Assertion ist nur 5 min gültig. Danach kann
      # die Azure CLI keine neuen Tokens (z. B. für Databricks) mehr holen (AADSTS700024).
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_INFRA }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: terraform databricks
        run: infra/scripts/ci-terraform-stack.sh databricks
