# CI: läuft für jeden PR und auf main. Keine Cloud-Zugriffe, keine Secrets.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: pytest
        run: uv run pytest -q
      - name: metadata
        run: uv run python -m tools.metadata validate
      - name: build wheel
        run: uv build --wheel src/dbxpoc_common -o dist
      - uses: actions/upload-artifact@v5
        with:
          name: wheel
          path: dist/*.whl

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"
      - uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: v0.64.0
      - name: fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: validate
        run: |
          for d in infra/terraform/bootstrap infra/terraform/account infra/terraform/stacks/*; do
            echo "::group::$d"
            terraform -chdir=$d init -backend=false -input=false >/dev/null
            terraform -chdir=$d validate -no-color
            echo "::endgroup::"
          done
      - name: tflint
        working-directory: infra/terraform
        run: |
          tflint --init --config "$(pwd)/.tflint.hcl"
          tflint --recursive --config "$(pwd)/.tflint.hcl"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --no-banner .
