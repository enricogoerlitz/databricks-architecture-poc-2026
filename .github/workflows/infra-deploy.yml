# Infrastruktur: main -> dev (auto) -> tst (Approval); Tag v* -> prd (Approval).
name: infra-deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["infra/**", ".github/workflows/infra-deploy.yml", ".github/workflows/_stage-infra.yml"]
  workflow_dispatch:
    inputs:
      env:
        description: Stage
        type: choice
        options: [dev, tst, prd]

permissions:
  id-token: write
  contents: read

jobs:
  dev:
    if: github.event_name == 'push' && github.ref_type == 'branch' || inputs.env == 'dev'
    uses: ./.github/workflows/_stage-infra.yml
    with: { env: dev }
    secrets: inherit

  tst:
    needs: dev
    if: github.event_name == 'push' && github.ref_type == 'branch'
    uses: ./.github/workflows/_stage-infra.yml
    with: { env: tst }
    secrets: inherit

  tst-manual:
    if: inputs.env == 'tst'
    uses: ./.github/workflows/_stage-infra.yml
    with: { env: tst }
    secrets: inherit

  prd:
    if: github.ref_type == 'tag' || inputs.env == 'prd'
    uses: ./.github/workflows/_stage-infra.yml
    with: { env: prd }
    secrets: inherit
